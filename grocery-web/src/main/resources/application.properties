spring.profiles.active=h2
file.destination=/tmp/groceries.csv

# ---- Auth / JWT (Android app) ----
app.jwt.secret=${JWT_SECRET:dev-grocery-jwt-secret-change-me-please-32bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# Base URL used in activation / password-reset email links.
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# ---- Email (same hmailplus SMTP as the rental app) ----
spring.mail.host=${MAIL_HOST:smtp.hmailplus.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:rentals@dliving.co.za}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


