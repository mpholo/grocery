<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Reset your Grocery password</title>
    <style>
        body { font-family: system-ui, Arial, sans-serif; background: #f6fbf6; margin: 0; }
        .card { max-width: 420px; margin: 48px auto; background: #fff; border: 1px solid #cfe7d6;
            border-radius: 16px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
        h1 { color: #14713e; font-size: 1.4rem; margin: 0 0 16px; }
        label { display: block; font-size: .9rem; margin: 12px 0 4px; color: #333; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #bcd; border-radius: 8px; box-sizing: border-box; }
        button { margin-top: 18px; width: 100%; padding: 11px; background: #1e9e57; color: #fff;
            border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .msg-error { color: #b3261e; margin: 10px 0; }
        .hint { color: #666; font-size: .8rem; margin-top: 6px; }
        a.btn { display: inline-block; margin-top: 16px; color: #1e9e57; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="card">
    <h1>Reset your password</h1>

    <div th:if="${success}">
        <p>Your password has been updated. You can now sign in.</p>
        <a class="btn" th:href="@{/login}">Go to sign in →</a>
    </div>

    <div th:unless="${success}">
        <p th:if="${token == null or token.isEmpty()}" class="msg-error">
            This reset link is missing its token. Please use the link from your email.
        </p>
        <div th:if="${token != null and !token.isEmpty()}">
            <p class="msg-error" th:if="${error}" th:text="${error}"></p>
            <form method="post" th:action="@{/reset-password}">
                <input type="hidden" name="token" th:value="${token}"/>
                <label for="password">New password</label>
                <input id="password" name="password" type="password" required/>
                <div class="hint">At least 6 characters, with an uppercase letter and a number.</div>
                <button type="submit">Set new password</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
