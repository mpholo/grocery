# ----------------------------------------------------------------------------
# nginx server blocks for grocery.dliving.co.za
#
# Matches the style of the existing dliving.co.za / www blocks in the `web`
# image (./rentalroomsapps). Add as a NEW file (e.g. grocery.conf) in the same
# place the existing *.conf lives, then rebuild + restart the `web` container.
#
# The grocery backend serves BOTH its web UI (/) and the REST API (/api), so we
# proxy everything to grocery_backend:8080.
#
# DEPLOY IN TWO STEPS — the HTTPS block references a cert that does not exist
# yet, and adding it before the cert exists will stop nginx (and take www down
# with it). So:
#   1. Add ONLY the port-80 block, rebuild `web`, bring it up.
#   2. Run certbot (see README), THEN add the port-443 block, rebuild `web`.
# ----------------------------------------------------------------------------

# --- Step 1: HTTP (ACME challenge + redirect to HTTPS) ---
server {
    listen 80;
    server_name grocery.dliving.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Step 2: HTTPS (reverse proxy to the grocery backend container) ---
server {
    listen 443 ssl;
    server_name grocery.dliving.co.za;

    ssl_certificate     /etc/letsencrypt/live/grocery.dliving.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grocery.dliving.co.za/privkey.pem;

    client_max_body_size 1024m;

    location / {
        proxy_pass http://grocery_backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------------
    # OPTIONAL but RECOMMENDED: lock the API down with HTTP Basic auth.
    # /api/** is permitAll in the backend, so without this anyone who knows
    # the URL can read/modify your lists. To enable, uncomment and provide a
    # password file (and add the same credentials to the Android app):
    #
    # auth_basic           "grocery";
    # auth_basic_user_file /etc/letsencrypt/grocery.htpasswd;
    # ---------------------------------------------------------------------
}
