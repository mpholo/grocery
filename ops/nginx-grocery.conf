# ----------------------------------------------------------------------------
# nginx server blocks for grocery.dliving.co.za
#
# Add these to the nginx config inside your `web` image (the ./rentalroomsapps
# build context), alongside the existing www.dliving.co.za server blocks, then
# rebuild + restart the `web` container.
#
# DEPLOY IN TWO STEPS (cert does not exist yet on first deploy):
#   1. Add ONLY the port-80 block below, rebuild `web`, bring it up. This lets
#      certbot answer the ACME challenge over HTTP.
#   2. Run the certbot command (see README), then add the port-443 block and
#      rebuild/restart `web` again.
# ----------------------------------------------------------------------------

# --- Step 1: HTTP (ACME challenge + redirect to HTTPS) ---
server {
    listen 80;
    listen [::]:80;
    server_name grocery.dliving.co.za;

    # Let's Encrypt webroot challenge (mounted at /var/www/certbot in `web`).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Step 2: HTTPS (reverse proxy to the grocery backend container) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grocery.dliving.co.za;

    ssl_certificate     /etc/letsencrypt/live/grocery.dliving.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grocery.dliving.co.za/privkey.pem;

    # Spring Boot streams CSV export; keep timeouts sane for proxied calls.
    location / {
        proxy_pass http://grocery_backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # OPTIONAL but RECOMMENDED: lock the API down with HTTP Basic auth.
    # The /api/** endpoints are currently permitAll in the backend, so
    # without this anyone who knows the URL can read/modify your lists.
    # To enable: create a password file and uncomment the two lines below,
    # then add the same credentials to the Android app (OkHttp interceptor).
    #
    #   htpasswd -c ./letsencrypt/conf/grocery.htpasswd groceryuser
    #   (mount it into `web` and reference the container path here)
    #
    # auth_basic           "grocery";
    # auth_basic_user_file /etc/letsencrypt/grocery.htpasswd;
    # ---------------------------------------------------------------------
}
